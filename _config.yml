title: Learning Wiki
description: 学习笔记、技术研究与实践记录
lang: zh-CN
url: https://ianliyi1996.github.io
baseurl: /learning-wiki
repository: IanLiYi1996/learning-wiki
theme: jekyll-theme-primer

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: wiki

include:
  - README.md
  - sources.md

readme_index:
  enabled: true
  remove_originals: false

optional_front_matter:
  remove_originals: false

relative_links:
  enabled: true
  collections: true

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - PAGES.md
  - vendor
  - node_modules
  - .bundle
  - .jekyll-cache
  - .jekyll-metadata
  - "**/__pycache__"
  - scripts
  - tests
  - wiki/topics/blockchain/source
  # Archived standalone exports otherwise overwrite the illustrated Markdown routes.
  # The original bytes remain in the repository; PDF/Word downloads are unchanged.
  - wiki/topics/physical-ai/Physical_AI_知识全景与学习指南.html
  - wiki/topics/physical-ai/advanced/Physical_AI_底层原理与实现细节.html
  - wiki/topics/physical-ai/industry/Physical_AI_业界产品与端到端方案.html
  - wiki/topics/physical-ai/conferences/gtc-berlin-2026/GTC_Berlin_2026_Physical_AI_深度调研报告.html
