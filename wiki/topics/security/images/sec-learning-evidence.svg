<text x="520.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">输入、结果、状态与限制</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">守住边界</text>
<text x="856.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">身份、范围、数据和费用</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">演练交接</text>
<text x="856.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">发现、审批、版本与复测</text>
