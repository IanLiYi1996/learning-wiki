<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">本 Wiki 的学习目标，不是官方课程、认证或实际执行许可。</text>
<rect x="56" y="128" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">分清概念</text>
<text x="184.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">一个案例解释资产与风险</text>
