<text x="520.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">写方案卡</text>
<text x="520.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">交付、验收、替代与 no-go</text>
