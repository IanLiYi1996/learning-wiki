<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="588" viewBox="0 0 1040 588" role="img" aria-labelledby="title desc">
<title id="title">绿色之前：未测、失败和完整证据要分流</title>
<desc id="desc">原创保守纸面模型；不复制 AWS 门禁，也不执行发布。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="588" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">绿色之前：未测、失败和完整证据要分流</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创保守纸面模型；不复制 AWS 门禁，也不执行发布。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">虚构记录</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">教学输出</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">含义</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">未授权／版本错／认</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">证未验</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">BLOCK</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不应进入签核</text>
<rect x="40" y="258" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">失败／不完整／</text>
<text x="53" y="312" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">scope conflict</text>
<rect x="220" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">BLOCK</text>
<rect x="610.0" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">任务未完成或目标不符</text>
<rect x="40" y="336" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="365" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">scoped out／覆盖</text>
<text x="53" y="390" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">缺／待审项</text>
<rect x="220" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">MANUAL_REVIEW</text>
<rect x="610.0" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">人工审范围或证据缺口</text>
<rect x="40" y="414" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="443" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">必要记录均齐全</text>
<rect x="220" y="414" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">RELEASE_REVIEW</text>
<rect x="610.0" y="414" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">待人审核，不是安全证明</text>
<line x1="40" y1="524" x2="1000" y2="524" stroke="#e0e7e2"/>
<text x="40" y="548" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">官方基础设施错误默认 fail-open；教学故意更保守，不能拿这份代码替换真实控制。</text>
</g>
</svg>
