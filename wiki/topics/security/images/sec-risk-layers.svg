<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">资产、可达路径、弱点与业务风险不是同一个量</title>
<desc id="desc">虚构订单服务的概念拆解；不是实际漏洞或风险测量。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">资产、可达路径、弱点与业务风险不是同一个量</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">虚构订单服务的概念拆解；不是实际漏洞或风险测量。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">保护对象与入口</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">订单数据是资产；公网接口是可接触路径</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">威胁与弱点</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">越权读订单是威胁情境；缺归属检查是漏洞</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务风险</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">结合发生可能性、影响、重要性与控制，不只看 CVSS</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">控制与证据</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">实施权限检查；保存范围、版本、结果与整改记录</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">云配置检查、运行异常检测、代码评审和攻击验证的证据不能互换。</text>
</g>
</svg>
