<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">合法身份还要通过功能、对象与属性授权</title>
<desc id="desc">虚构订单 API；归属与租户必须来自可信服务端上下文。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">合法身份还要通过功能、对象与属性授权</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">虚构订单 API；归属与租户必须来自可信服务端上下文。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">身份与租户</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">验证会话／令牌；客户端自报 tenant 不是可信归属</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">功能层</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">能退款、取消或查看吗？角色不能只靠界面隐藏</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">对象层</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">能访问这一笔订单吗？同租户不等于同所有者</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">属性与状态</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">允许哪些字段和状态转换？并发、幂等与额度还需验证</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">输入校验、输出编码、参数化与业务授权各管一层；拒绝还需证明无泄漏和副作用。</text>
</g>
</svg>
