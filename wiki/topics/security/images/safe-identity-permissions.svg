<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">身份、会话、策略与业务动作是不同的判断</title>
<desc id="desc">概念责任图，不是可部署 IAM 策略或通用权限求值器。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">身份、会话、策略与业务动作是不同的判断</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">概念责任图，不是可部署 IAM 策略或通用权限求值器。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">身份与恢复</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">人员、工作负载、身份源、MFA、会话与紧急通道</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">承担与授权</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">角色信任、动作资源、可信属性与实际 Allow／Deny</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">组织与例外</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">SCP、RCP、权限边界、资源策略的适用范围分别核验</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务验收</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">对应租户、对象、功能、状态；允许与拒绝证据一起看</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">SCP 不授予权限、不覆盖所有主体；OAuth 授权与 OIDC 身份不能混用。</text>
</g>
</svg>
