<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="598" viewBox="0 0 1040 598" role="img" aria-labelledby="title desc">
<title id="title">四个离线小合同：先区分输入假设和真实证据</title>
<desc id="desc">原创标准库验算，不是 IAM、密码学审批、检测或恢复系统。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="598" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">四个离线小合同：先区分输入假设和真实证据</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创标准库验算，不是 IAM、密码学审批、检测或恢复系统。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">虚构问题</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">教学结果</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">仍未证明</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">相同 owner、不同</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">tenant</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">拒绝读取</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">元数据来源、真实授权和实际接口行为</text>
<rect x="40" y="258" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">动作摘要匹配／版本</text>
<text x="53" y="312" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">改变</text>
<rect x="220" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">待审核／重新审批</text>
<rect x="610.0" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">批准者身份、签名、权限、原子性和防重放</text>
<rect x="40" y="336" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="365" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">恢复点 90、事故</text>
<text x="53" y="390" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">120、验证 190</text>
<rect x="220" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">数据窗口 30、恢复延迟 70</text>
<rect x="610.0" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">备份可信度、业务数据与真实恢复能力</text>
<rect x="40" y="414" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="443" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">eligible 4、采集</text>
<text x="53" y="468" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">3、验证 2</text>
<rect x="220" y="414" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">验证比例 0.5，空分母为未知</text>
<rect x="610.0" y="414" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">资产清单完整性与真实检测效果</text>
<line x1="40" y1="534" x2="1000" y2="534" stroke="#e0e7e2"/>
<text x="40" y="558" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">MATCH_FOR_REVIEW 不是执行许可；hash 匹配不是签名，零对象不是 100% 覆盖。</text>
</g>
</svg>
