<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">数据不只在主库：副本和权限沿流程扩散</title>
<desc id="desc">虚构订单的治理清单；列出位置不代表推荐复制。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">数据不只在主库：副本和权限沿流程扩散</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">虚构订单的治理清单；列出位置不代表推荐复制。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务输入</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">字段、目的、分类、责任、保留；先减少不必要收集</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">主库与授权</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">读取、写入、租户、密钥与解密权限；加密不包办</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">派生副本</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">导出、日志、遥测、截图、缓存、索引和推理上下文</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">历史与删除</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">备份、版本、到期、例外；恢复后还需处理删除记录</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">每份副本都问谁可读、为什么保存、怎样删除与验证；主库回执不是全链路删除证明。</text>
</g>
</svg>
