<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">检测链断了一段，面板就不能代表实际覆盖</title>
<desc id="desc">箭头是证据与责任交接；不描绘任何服务的内部实现。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="540" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">检测链断了一段，面板就不能代表实际覆盖</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">箭头是证据与责任交接；不描绘任何服务的内部实现。</text>
<rect x="56" y="128" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">资产与范围</text>
<text x="184.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">完整分母、owner 与</text>
<text x="184.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">eligible</text>
<rect x="392" y="128" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">采集与健康</text>
<text x="520.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">投递、身份、时间与缺口</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">分析与验证</text>
<text x="856.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">规则、正反例和置信度</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">通知与值守</text>
<text x="856.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">收到、确认、超时升级</text>
<rect x="392" y="308" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">批准与处置</text>
<text x="520.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">对象、影响、证据与回滚</text>
<rect x="56" y="308" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">复查与改进</text>
<text x="184.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">是否有效、未覆盖与期限</text>
<path d="M 312,188 L 392,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 648,188 L 728,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 856,248 L 856,308" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 728,368 L 648,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 392,368 L 312,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<line x1="40" y1="476" x2="1000" y2="476" stroke="#e0e7e2"/>
<text x="40" y="500" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">告警数量不是覆盖率；Event history、runtime agent 与业务日志的范围不能互换。</text>
</g>
</svg>
