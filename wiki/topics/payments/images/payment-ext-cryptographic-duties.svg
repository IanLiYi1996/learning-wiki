<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">密码功能、密钥管理和业务授权分别有人负责</title>
<desc id="desc">纯课堂设计：仅使用虚构代号，不含真实卡数据、PIN、密钥或生产接口。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">密码功能、密钥管理和业务授权分别有人负责</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">纯课堂设计：仅使用虚构代号，不含真实卡数据、PIN、密钥或生产接口。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务审批</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">确认付款或退款的对象、金额、用途与审批条件</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">运算调用</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">仅请求允许的密码任务；不得越权修改密钥用途</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">密钥管理</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">创建、用途、轮换、启停与销毁；敏感动作独立授权</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">设备责任</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">HSM保护密钥与执行运算；托管也需明确责任边界</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">只读审计</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">核对身份、授权、动作和时间；不记录真实秘密</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">双人控制不等于单次双签或知识分割；HSM与Token均不能自动赋予业务付款权限。</text>
</g>
</svg>
