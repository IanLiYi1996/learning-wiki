<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="494" viewBox="0 0 1040 494" role="img" aria-labelledby="title desc">
<title id="title">100 元权益：预留、捕获、出款是不同事件</title>
<desc id="desc">闭环钱包教学例；不含费用与税，不是外部银行卡的统一会计模型。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="494" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">100 元权益：预留、捕获、出款是不同事件</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">闭环钱包教学例；不含费用与税，不是外部银行卡的统一会计模型。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">事件</text>
<rect x="220" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">用户可用／预留</text>
<rect x="480.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">商户应付</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">银行资产</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">起点</text>
<rect x="220" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100／0</text>
<rect x="480.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="740.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">预留 40</text>
<rect x="220" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">60／40</text>
<rect x="480.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="740.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">捕获 40</text>
<rect x="220" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">60／0</text>
<rect x="480.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">40</text>
<rect x="740.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">出款 40</text>
<rect x="220" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">60／0</text>
<rect x="480.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="740.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">60</text>
<line x1="40" y1="430" x2="1000" y2="430" stroke="#e0e7e2"/>
<text x="40" y="454" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">每步核对权益、债务与资产；取消尚未捕获的预留，会把 40 恢复为可用。</text>
</g>
</svg>
