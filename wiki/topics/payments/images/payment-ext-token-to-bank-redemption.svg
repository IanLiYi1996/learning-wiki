<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="894" viewBox="0 0 1040 894" role="img" aria-labelledby="title desc">
<title id="title">从链上 Token 到银行到账：分开核验</title>
<desc id="desc">以合格企业的发行人直兑为教学例；箭头表示核验顺序，不是统一 API 或资金搬运。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="894" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">从链上 Token 到银行到账：分开核验</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">以合格企业的发行人直兑为教学例；箭头表示核验顺序，不是统一 API 或资金搬运。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">链上与保管</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">核对币、网络、控制权和确认；不证明银行已入账</text>
<path d="M 520,209 L 520,241" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">发行侧入账</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">核对收到的 Token 与可用余额；不得混同待确认余额</text>
<path d="M 520,325 L 520,357" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">资格与兑付请求</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">核对地区、客户资格、身份、法律约束与出款账户</text>
<path d="M 520,441 L 520,473" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">发行人与储备</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">发行人履行赎回责任；储备支持不替代可执行权利</text>
<path d="M 520,557 L 520,589" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">银行法币出款</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">按适用轨道处理；另查到账、费用、拒收与退回</text>
<path d="M 520,673 L 520,705" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="705" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="741" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">账本与对账</text>
<text x="292" y="737" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">匹配链上记录、兑付记录与银行流水，关闭差异</text>
<line x1="40" y1="830" x2="1000" y2="830" stroke="#e0e7e2"/>
<text x="40" y="854" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">链上完成、发行侧兑付、银行到账分别确认；非每次转币都触发储备银行转账。</text>
</g>
</svg>
