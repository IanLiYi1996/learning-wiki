<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">支付行业地图：角色 × 产品 × 场景</title>
<desc id="desc">每家公司可以占多个格子；不要把产品当牌照。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">支付行业地图：角色 × 产品 × 场景</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">每家公司可以占多个格子；不要把产品当牌照。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务场景</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">消费／电商 · 企业 AP/AR · 平台分账 · 汇款／出款</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">产品与入口</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">钱包 · 卡／虚拟卡 · QR · 网关 · 支付编排</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">产业链角色</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">发卡 · 收单 · 处理 · PSP／PayFac · 卡网络</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">资金与网络</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">卡 Rail · 批量账户支付 · 即时账户支付 · 跨境安排</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">横向责任</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">身份 · 风控／AML · 客户资金 · 账本／对账 · 数据安全</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">本读本的学习地图；分层表示分析维度，不是服务器部署。</text>
</g>
</svg>
