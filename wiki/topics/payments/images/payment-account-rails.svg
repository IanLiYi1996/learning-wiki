<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">RTGS</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">零售即时支付</text>
