<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">支付工程：API 后面还有账和钱</title>
<desc id="desc">这是教学职责图，不是任何公司的生产架构。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">支付工程：API 后面还有账和钱</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">这是教学职责图，不是任何公司的生产架构。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">入口与权限</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">商户 API／Checkout · 用户授权 · 凭证接入</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">支付控制</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">风险 · 路由 · 通道适配 · 状态机 · 幂等</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">资金与账本</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">复式分录 · 待处理资金 · 应收应付 · 调整</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">结算与运营</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">出款 · 流动性 · 三方对账 · 异常关闭</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">横向保障</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">密钥／数据隔离 · 审计 · 可用性 · 恢复验证</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">授权、记账、出款、对账有独立结果；不应压成一个 success 字段。</text>
</g>
</svg>
