<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
<title id="title">$100 交易额，不是 $100 支付公司收入</title>
<desc id="desc">教学假设费率示例；所有金额单位为美元。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="700" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">$100 交易额，不是 $100 支付公司收入</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">教学假设费率示例；所有金额单位为美元。</text>
<path d="M 300,245 L 350,245 L 350,185 L 420,185" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 300,300 L 350,300 L 350,375 L 420,375" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 560,430 L 560,460 L 205,460 L 205,500" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 560,460 L 520,460 L 520,500" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 560,460 L 845,460 L 845,500" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="60" y="200" width="240" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="180.0" y="263.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">消费者支付 $100</text>
<text x="180.0" y="298.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">交易规模</text>
<rect x="420" y="130" width="280" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="560.0" y="178.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">商户净额 $97.50</text>
<text x="560.0" y="213.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">未计其他调整</text>
<rect x="420" y="320" width="280" height="110" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="560.0" y="368.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">MDR 合计 $2.50</text>
<text x="560.0" y="403.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">商户费用</text>
<rect x="80" y="500" width="250" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="205.0" y="543.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Interchange $1.70</text>
<text x="205.0" y="578.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">本例发卡侧部分</text>
<rect x="395" y="500" width="250" height="100" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="543.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Network $0.20</text>
<text x="520.0" y="578.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">网络费用</text>
<rect x="710" y="500" width="270" height="100" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="845.0" y="543.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">服务部分 $0.60</text>
<text x="845.0" y="578.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">不是 PSP 净利润</text>
<line x1="40" y1="636" x2="1000" y2="636" stroke="#e0e7e2"/>
<text x="40" y="660" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">这是金额分配关系图，不是资金路径；$1.70 + $0.20 + $0.60 = $2.50。</text>
</g>
</svg>
