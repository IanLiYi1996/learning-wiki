<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="494" viewBox="0 0 1040 494" role="img" aria-labelledby="title desc">
<title id="title">三种卡：资金从哪里来</title>
<desc id="desc">比较典型资金模式；卡面网络品牌不能代替卡种判断。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="494" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">三种卡：资金从哪里来</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">比较典型资金模式；卡面网络品牌不能代替卡种判断。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">问题</text>
<rect x="220" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">借记卡</text>
<rect x="480.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">信用卡</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">预付卡</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">典型资金来源</text>
<rect x="220" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">银行账户已有资金</text>
<rect x="480.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">发卡方授信</text>
<rect x="740.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">预先加载的资金</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">消费看什么</text>
<rect x="220" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">账户可用资金</text>
<rect x="480.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">可用额度与授权</text>
<rect x="740.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">预付余额与占用</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">之后要还款吗</text>
<rect x="220" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">通常无需；透支另看</text>
<rect x="480.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">需按账单偿还</text>
<rect x="740.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">通常无需；信用安排另看</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">主要运营问题</text>
<rect x="220" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">余额、冻结与争议</text>
<rect x="480.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">账单、还款和利息</text>
<rect x="740.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">充值、费用与余额</text>
<line x1="40" y1="430" x2="1000" y2="430" stroke="#e0e7e2"/>
<text x="40" y="454" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">产品机制示意，不是全球法律分类；透支、费用与保护范围需查具体条款。</text>
</g>
</svg>
