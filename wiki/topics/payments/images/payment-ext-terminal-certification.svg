<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="546" viewBox="0 0 1040 546" role="img" aria-labelledby="title desc">
<title id="title">终端三层测试：通信、处理逻辑与端到端集成</title>
<desc id="desc">按测试责任分层，不表示三家公司或三个独立服务器。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="546" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">终端三层测试：通信、处理逻辑与端到端集成</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">按测试责任分层，不表示三家公司或三个独立服务器。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">L1 通信接口</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">机械、电气、射频及数据交换：能否按要求通信</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">L2 交易内核</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">EMV应用处理逻辑：能否按规范处理接触／非接触交易</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">L3 集成验证</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">完整终端与商户／收单系统：按支付系统要求端到端测试</text>
<line x1="40" y1="482" x2="1000" y2="482" stroke="#e0e7e2"/>
<text x="40" y="506" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">EMV互操作测试不替代PCI安全要求；组件通过测试不等于所有集成已获准。</text>
</g>
</svg>
