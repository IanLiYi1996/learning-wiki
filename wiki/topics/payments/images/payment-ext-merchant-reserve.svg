<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="494" viewBox="0 0 1040 494" role="img" aria-labelledby="title desc">
<title id="title">预售100万元，留存20万元仍有剩余敞口</title>
<desc id="desc">教学假设：留存20%、持有180天；释放前发生退款或拒付，忽略费用及追偿。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="494" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">预售100万元，留存20万元仍有剩余敞口</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">教学假设：留存20%、持有180天；释放前发生退款或拒付，忽略费用及追偿。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">项目</text>
<rect x="220" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">本批初始安排</text>
<rect x="480.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">损失情景：需退30万</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">损失情景：需退100万</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">预售收款</text>
<rect x="220" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100万元</text>
<rect x="480.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100万元</text>
<rect x="740.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100万元</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">准备金</text>
<rect x="220" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">20万元</text>
<rect x="480.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">可覆盖20万元</text>
<rect x="740.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">可覆盖20万元</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">已出款</text>
<rect x="220" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">80万元</text>
<rect x="480.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">假设商户无法回款</text>
<rect x="740.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">假设商户无法回款</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">剩余缺口</text>
<rect x="220" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">尚未发生退款或拒付</text>
<rect x="480.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">30−20＝10万元</text>
<rect x="740.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">100−20＝80万元</text>
<line x1="40" y1="430" x2="1000" y2="430" stroke="#e0e7e2"/>
<text x="40" y="454" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">情景敞口不等于预计损失；两种情景不叠加；留存准备金不等于客户资金隔离。</text>
</g>
</svg>
