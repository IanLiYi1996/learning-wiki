<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">安全与合规，分别回答不同问题</title>
<desc id="desc">任何一项通过，都不能自动替代其他控制。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">安全与合规，分别回答不同问题</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">任何一项通过，都不能自动替代其他控制。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">认证／3DS</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">是不是可信主体在操作？不等于发卡授权</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">Fraud</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">交易是不是欺诈？关注损失和误拒</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">KYC／KYB／AML</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">客户与企业是谁？资金／行为是否异常？</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">制裁与政策</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">对象或交易是否被禁止？适用规则需单独查</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">PCI 与资金保护</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">卡数据是否安全？客户资金权利如何安排？</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">分层是学习整理，不表示合规只在付款时运行或一定实时拦截。</text>
</g>
</svg>
