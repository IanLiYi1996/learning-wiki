<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="582" viewBox="0 0 1040 582" role="img" aria-labelledby="title desc">
<title id="title">WebGL 数据、布局、程序和目标分开管理</title>
<desc id="desc">绑定一个对象不等于上传数据，也不等于提交绘制。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="582" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">WebGL 数据、布局、程序和目标分开管理</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">绑定一个对象不等于上传数据，也不等于提交绘制。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">对象</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">持有／描述什么</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">不能替代什么</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Buffer</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">顶点／索引／uniform 等字节存储</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">CPU 数组变更不会自动同步</text>
<rect x="40" y="248" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">VAO</text>
<rect x="220" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">attribute 读取配置、buffer 引用、index</text>
<text x="233" y="302" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">绑定</text>
<rect x="610.0" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是顶点数据的副本</text>
<rect x="40" y="326" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Program</text>
<rect x="220" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">链接后的 shader 与接口位置</text>
<rect x="610.0" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不包含全部深度／混合状态</text>
<rect x="40" y="394" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="423" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Texture /</text>
<text x="53" y="448" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">sampler</text>
<rect x="220" y="394" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">图像存储与采样配置</text>
<rect x="610.0" y="394" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">uniform 的纹理 unit 只是绑定槽</text>
<rect x="40" y="472" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="501" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Framebuffer</text>
<rect x="220" y="472" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="501" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">附件引用、绘制目标</text>
<rect x="610.0" y="472" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="501" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">complete 不保证本次 draw 正确</text>
<line x1="40" y1="518" x2="1000" y2="518" stroke="#e0e7e2"/>
<text x="40" y="542" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
