<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">TSL、NodeMaterial 与后端着色语言</title>
<desc id="desc">TSL 描述计算，不是在 GPU 上解释执行普通 JavaScript。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">TSL、NodeMaterial 与后端着色语言</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">TSL 描述计算，不是在 GPU 上解释执行普通 JavaScript。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">开发者表达</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">TSL 节点、组合、条件与输入</text>
<path d="M 520,209 L 520,241" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">材质／渲染器</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">NodeMaterial 组织资源、光照与管线</text>
<path d="M 520,325 L 520,357" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">后端生成</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">WebGPU → WGSL；适用 WebGL 2 路径 → GLSL</text>
<path d="M 520,441 L 520,473" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">设备能力</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">分别验收计算、后处理、格式和 feature；fallback 不自动等价</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">分层表示责任边界，不要求每层独立部署。</text>
</g>
</svg>
