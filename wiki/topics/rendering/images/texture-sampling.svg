<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">一张纹理有四份不同契约</title>
<desc id="desc">从文件到采样值：颜色编码、坐标定位、重建过滤和业务用途不能混成一个开关。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">一张纹理有四份不同契约</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">从文件到采样值：颜色编码、坐标定位、重建过滤和业务用途不能混成一个开关。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">存储</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">格式／类型／颜色编码／mip levels</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">定位</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">UV／寻址模式／翻转／纹理变换</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">重建</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">nearest／linear／mipmap／各向异性</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">用途</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">颜色贴图 ≠ 法线／粗糙度／深度等数据贴图</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">mip LOD 依赖屏幕导数；PNG／JPEG 的网络压缩不等于 GPU 压缩。</text>
</g>
</svg>
