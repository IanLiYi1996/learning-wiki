<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">执行不逃逸，还需要网络、身份与数据边界</title>
<desc id="desc">原创职责分解；sandbox 是受约束环境，microVM 是执行机制之一。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">执行不逃逸，还需要网络、身份与数据边界</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创职责分解；sandbox 是受约束环境，microVM 是执行机制之一。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">执行边界</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">程序、系统接口、设备、宿主与邻居；runtime 决定主要路径</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">网络边界</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">DNS、地址、协议、重定向与代理；批准域名不是批准所有操作</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">身份边界</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">任务、租户、用户、资源与动作；业务服务端再次授权</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">数据与状态</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">镜像、快照、浏览器、产物、日志和保留；终止计算不是全部删除</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">四层要分别验收；本图不是产品内部架构或真实安全测试结果。</text>
</g>
</svg>
