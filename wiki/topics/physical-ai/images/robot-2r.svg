<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">同一个末端点，可以对应两种关节构型</title>
<desc id="desc">平面 2R 原创教学例：连杆长度都是 1，目标点为 (1, 1)，角度用弧度。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="560" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">同一个末端点，可以对应两种关节构型</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">平面 2R 原创教学例：连杆长度都是 1，目标点为 (1, 1)，角度用弧度。</text>
<path d="M 175,400 L 520,400" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 200,425 L 200,110" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<text x="527" y="405" font-size="18" fill="#23312b" font-weight="400" text-anchor="start">x</text>
<text x="196" y="100" font-size="18" fill="#23312b" font-weight="400" text-anchor="start">y</text>
<path d="M200,400 L410,400 L410,190" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
<circle cx="410" cy="400" r="9" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<path d="M200,400 L200,190 L410,190" fill="none" stroke="#7c3aed" stroke-width="9" stroke-linecap="round"/>
<circle cx="200" cy="190" r="9" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
<circle cx="410" cy="190" r="9" fill="#15803d"/>
<text x="428" y="176" font-size="20" fill="#15803d" font-weight="400" text-anchor="start">目标 (1, 1)</text>
<rect x="580" y="145" width="380" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="770.0" y="196.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">解 A：q = (0, π/2)</text>
<text x="770.0" y="231.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">先向右，再向上；l₁ = l₂ = 1</text>
<rect x="580" y="297" width="380" height="116" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="770.0" y="348.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">解 B：q = (π/2, −π/2)</text>
<text x="770.0" y="383.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">先向上，再向右；相同末端位置</text>
<line x1="40" y1="496" x2="1000" y2="496" stroke="#e0e7e2"/>
<text x="40" y="520" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">原创数值例：仅说明 FK／IK 多解；未加入限位、碰撞或真实设备。</text>
</g>
</svg>
