<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">自动驾驶：模型、数据、宿主与测试</title>
<desc id="desc">模型输出、车载硬件和验证平台属于不同责任层。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">自动驾驶：模型、数据、宿主与测试</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">模型输出、车载硬件和验证平台属于不同责任层。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">数据／场景</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">驾驶记录、训练材料、道路与传感器仿真</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">驾驶模型</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">感知／推理与驾驶策略；核对输入输出及版本</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">车载宿主</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">Thor／DRIVE AGX 等计算与接口条件</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">系统集成</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">传感器配置、车辆控制、DRIVE 软件与运行约束</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">测试与证据</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">Halos／dSPACE 等测试链；项目阶段与安全证据分开</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">沿用会议报告口径；图示分工，不推断全部车辆或模型已正式部署。</text>
</g>
</svg>
