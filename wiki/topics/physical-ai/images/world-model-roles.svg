<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="562" viewBox="0 0 1040 562" role="img" aria-labelledby="title desc">
<title id="title">世界模型：观测更新、想象训练与执行</title>
<desc id="desc">能预测画面不等于辨识了真实物理；想象训练不等于运行时每步搜索。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="562" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">世界模型：观测更新、想象训练与执行</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">能预测画面不等于辨识了真实物理；想象训练不等于运行时每步搜索。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">阶段／方法</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">看哪些证据、做什么</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">输出与边界</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">观测更新</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">真实观测 + 前一动作 + 循环记忆</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">形成后验潜在表示</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">先验想象</text>
<rect x="220" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">从当前表示沿动作条件转移</text>
<rect x="610.0" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">没有未来真实图像输入</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Dreamer 训练</text>
<rect x="220" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">想象奖励／继续头 + actor／critic</text>
<rect x="610.0" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">更新策略与价值；模型误差另评估</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Dreamer 执行</text>
<rect x="220" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">更新表示后直接从 actor 取动作</text>
<rect x="610.0" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是每步在线候选搜索</text>
<rect x="40" y="452" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="481" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">PlaNet 规划</text>
<rect x="220" y="452" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">搜索候选动作段；模型预测评价</text>
<rect x="610.0" y="452" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">只执行首步，再观测重规划</text>
<line x1="40" y1="498" x2="1000" y2="498" stroke="#e0e7e2"/>
<text x="40" y="522" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
