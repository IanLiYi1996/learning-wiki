<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="504" viewBox="0 0 1040 504" role="img" aria-labelledby="title desc">
<title id="title">输出轴、原始电机和末端接触，不能混成同一数组</title>
<desc id="desc">Orbita2D 原创数字例，比例为 1；不是实物标定或可下发命令。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="504" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">输出轴、原始电机和末端接触，不能混成同一数组</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">Orbita2D 原创数字例，比例为 1；不是实物标定或可下发命令。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">输入对象</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">模型映射</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">另一侧对象</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">ring／center [0</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">.5,0.5]</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">耦合逆运动学</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">A／B [1,0]</text>
<rect x="40" y="258" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">A／B [1,1]</text>
<rect x="220" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">耦合正运动学</text>
<rect x="610.0" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">ring／center [1,0]</text>
<rect x="40" y="326" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">原始电机限力矩</text>
<rect x="220" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">传动、姿态、接触继续影响结果</text>
<rect x="610.0" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不等于末端接触力安全证明</text>
<rect x="40" y="394" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="423" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">手势／夹爪 close</text>
<rect x="220" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">标定、反馈、滑移与任务验收</text>
<rect x="610.0" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不等于闭环抓取成功</text>
<line x1="40" y1="440" x2="1000" y2="440" stroke="#e0e7e2"/>
<text x="40" y="464" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">同维度只表示容器相似；单位、轴顺序、零位、机构版本和反馈定义仍然必需。</text>
</g>
</svg>
