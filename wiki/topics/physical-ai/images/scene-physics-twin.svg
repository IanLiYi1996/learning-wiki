<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="572" viewBox="0 0 1040 572" role="img" aria-labelledby="title desc">
<title id="title">场景描述、物理引擎、仿真与数字孪生</title>
<desc id="desc">画面逼真、接触准确和任务可靠性是不同测试对象。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="572" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">场景描述、物理引擎、仿真与数字孪生</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">画面逼真、接触准确和任务可靠性是不同测试对象。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">对象</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">主要职责</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">不自动提供</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">OpenUSD 等场景描</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">述</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">组合与交换几何、材质等资产</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是物理求解器</text>
<rect x="40" y="258" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">物理引擎</text>
<rect x="220" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">运动、接触、约束与积分</text>
<rect x="610.0" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不自动匹配真实参数</text>
<rect x="40" y="326" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">仿真平台</text>
<rect x="220" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">组织场景、物理、渲染与传感器</text>
<rect x="610.0" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不自动成为指定实物孪生</text>
<rect x="40" y="394" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="423" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">数字孪生</text>
<rect x="220" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">绑定真实对象、参数与更新记录</text>
<rect x="610.0" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是任何好看的三维场景</text>
<rect x="40" y="462" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="491" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">世界模型</text>
<rect x="220" y="462" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="491" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">从经验学习条件演化／预测</text>
<rect x="610.0" y="462" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="491" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">生成画面不保证动力学与动作正确</text>
<line x1="40" y1="508" x2="1000" y2="508" stroke="#e0e7e2"/>
<text x="40" y="532" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
