<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">遥操作留下日志，还要确认日志能教什么</title>
<desc id="desc">按照当前 HDF5、Rerun 和遥操作接口的实际边界组织。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">遥操作留下日志，还要确认日志能教什么</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">按照当前 HDF5、Rerun 和遥操作接口的实际边界组织。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">人的闭环</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">相机曝光／显示、人的反应、手柄采样、命令与执行各有时钟</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">记录字段</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">HDF5 action 取参考目标；qpos 的底盘列实际为速度</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">缺失证据</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">采样索引和 MP4 fps 不能恢复曝光、抖动、目标应用时刻</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">学习导出</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">固定标签层、列顺序、因果对齐、episode 切分和归一化</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">Rerun 可帮助诊断，但当前示例没有完整的目标动作／任务终止标签；回放脚本可能发命令。</text>
</g>
</svg>
