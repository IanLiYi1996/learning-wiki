<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">从像素到运动，中间有尺度、坐标和可达性</title>
<desc id="desc">原创简化感知链；当前位置工具没有估计物体完整朝向。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="540" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">从像素到运动，中间有尺度、坐标和可达性</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创简化感知链；当前位置工具没有估计物体完整朝向。</text>
<rect x="56" y="128" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">检测与 mask</text>
<text x="184.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">像素区域与语义；不是抓取成功</text>
<text x="184.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">率</text>
<rect x="392" y="128" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">有效米制深度</text>
<text x="520.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">明确单位、标定和缺失；拒绝相</text>
<text x="520.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">对深度冒充米</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">相机坐标点</text>
<text x="856.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">内参反投影；深度／RGB 须对</text>
<text x="856.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">齐</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="349.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">世界／机器人目标</text>
<text x="856.0" y="384.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">方向明确的外参；姿态时钟须一</text>
<text x="856.0" y="407.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">致</text>
<rect x="392" y="308" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="349.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">IK 与路径</text>
<text x="520.0" y="384.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">可达、速度与关节约束；另查碰</text>
<text x="520.0" y="407.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">撞</text>
<rect x="56" y="308" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">执行与任务反馈</text>
<text x="184.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">命令完成、接触与任务分别验收</text>
<path d="M 312,188 L 392,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 648,188 L 728,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 856,248 L 856,308" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 728,368 L 648,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 392,368 L 312,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<line x1="40" y1="476" x2="1000" y2="476" stroke="#e0e7e2"/>
<text x="40" y="500" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">4×4 shape 不证明朝向已知；零加速度也不等于速度归零或机器人停止。</text>
</g>
</svg>
