<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">边缘部署的四层责任</title>
<desc id="desc">峰值算力、模型推理速度和端到端控制时限不是同一个指标。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">边缘部署的四层责任</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">峰值算力、模型推理速度和端到端控制时限不是同一个指标。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">计算宿主</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">模块／工业 PC；电源、散热、传感器与载板</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">系统与依赖</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">OS、驱动、CUDA／适配栈、设备接口及版本</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">模型运行时</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">权重／ONNX → engine；shape、精度、插件与目标硬件</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">运行系统</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">采集、预处理、队列、动作时限、反馈与故障策略</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">分层表示责任边界，不要求每层独立部署。</text>
</g>
</svg>
