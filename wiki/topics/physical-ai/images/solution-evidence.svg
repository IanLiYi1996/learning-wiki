<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="562" viewBox="0 0 1040 562" role="img" aria-labelledby="title desc">
<title id="title">端到端方案，先读清证据范围</title>
<desc id="desc">软件能获取、商业能联系、客户曾运行、计划将扩展，是不同事实。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="562" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">端到端方案，先读清证据范围</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">软件能获取、商业能联系、客户曾运行、计划将扩展，是不同事实。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">证据</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">可以记录什么</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">不能直接推出什么</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">公开包／文档</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">可获取的代码、权重或工具</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">自己的任务已无需集成</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">商业产品／支持</text>
<rect x="220" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">约定获取与交付形式</text>
<rect x="610.0" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">目标现场全部要求都满足</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">供应商案例</text>
<rect x="220" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">公开披露的客户与任务范围</text>
<rect x="610.0" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">独立性能审计</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">客户现场披露</text>
<rect x="220" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">指定地点、时间、流程的运行证据</text>
<rect x="610.0" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">任意工位与对象都可泛化</text>
<rect x="40" y="452" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="481" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">试点／未来计划</text>
<rect x="220" y="452" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">限定试点或已宣布扩展</text>
<rect x="610.0" y="452" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">计划中的设备已正式运行</text>
<line x1="40" y1="498" x2="1000" y2="498" stroke="#e0e7e2"/>
<text x="40" y="522" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
