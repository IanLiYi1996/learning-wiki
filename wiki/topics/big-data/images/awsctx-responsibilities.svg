<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">业务上下文、检索、记忆与输入容量的职责</title>
<desc id="desc">原创职责对照；能力存在交叉，不是互斥分类，也不表示产品已按图集成。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">业务上下文、检索、记忆与输入容量的职责</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创职责对照；能力存在交叉，不是互斥分类，也不表示产品已按图集成。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">AWS Context</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">业务对象是什么？如何关联？哪些定义与规则适用？</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">Knowledge Bases</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">哪些证据或业务数据可取回？也覆盖图与结构化数据</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">AgentCore Memory</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">交互中发生过什么？哪些经历与用户偏好值得保留？</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">模型上下文窗口</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">一次调用能容纳多少输入？不是业务定义或治理系统</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">依据 2026-11-24 正文来源作职责概括；不是性能排行或服务开放状态证明。</text>
</g>
</svg>
