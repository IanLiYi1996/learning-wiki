<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">Ontology 位于数据资产之上的操作层</title>
<desc id="desc">它组织业务语义与受控行动，不替代底层存储、表格式和计算引擎。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">Ontology 位于数据资产之上的操作层</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">它组织业务语义与受控行动，不替代底层存储、表格式和计算引擎。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务源系统</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">ERP、CRM、MES、WMS、数据库、IoT、文档与 API</text>
<path d="M 520,209 L 520,241" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">数据平台</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">采集、湖仓、数仓、流处理、查询与模型</text>
<path d="M 520,325 L 520,357" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">Ontology</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">Objects／Properties／Links + Logic + Actions + Security</text>
<path d="M 520,441 L 520,473" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">操作应用</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">业务工作台、自定义应用、自动化与 Agent</text>
<path d="M 520,557 L 520,589" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">业务反馈</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">受控写回、通知、决策记录、效果与审计</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">分层表示责任边界，不要求每层独立部署。</text>
</g>
</svg>
