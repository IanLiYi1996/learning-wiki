<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="514" viewBox="0 0 1040 514" role="img" aria-labelledby="title desc">
<title id="title">AI FDE 的两条变更评审路线</title>
<desc id="desc">Global Branch Proposal 与 Git Pull Request 是相关但不同的评审系统。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="514" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">AI FDE 的两条变更评审路线</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">Global Branch Proposal 与 Git Pull Request 是相关但不同的评审系统。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">对象</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">评审路径</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">授权与记录</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">可分支平台资源</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">Global Branch → Proposal → 合并检查／</text>
<text x="233" y="234" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">政策审批 → Main</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是所有资源都支持该路径</text>
<rect x="40" y="258" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">代码仓库</text>
<rect x="220" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">Git branch → PR → CI／Review → Main</text>
<rect x="610.0" y="258" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">保留代码、测试与评审证据</text>
<rect x="40" y="326" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">不支持分支／敏感操</text>
<text x="53" y="380" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">作</text>
<rect x="220" y="326" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">按工具批准策略单独确认</text>
<rect x="610.0" y="326" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">继承用户权限不代表自动最小权限</text>
<rect x="40" y="404" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="433" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">审计</text>
<rect x="220" y="404" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="433" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">会话活动 + 平台 audit logs</text>
<rect x="610.0" y="404" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="433" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">Chat outline 不自动等于不可变合规审计</text>
<line x1="40" y1="450" x2="1000" y2="450" stroke="#e0e7e2"/>
<text x="40" y="474" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
