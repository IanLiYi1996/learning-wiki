<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="568" viewBox="0 0 1040 568" role="img" aria-labelledby="title desc">
<title id="title">本地算术验证机制，不复现模型成绩</title>
<desc id="desc">所有数字是原创构造；标准库、无模型、无网络、无写入。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="568" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">本地算术验证机制，不复现模型成绩</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">所有数字是原创构造；标准库、无模型、无网络、无写入。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">问题</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">可验算结果</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">边界</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">成功条件目标</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">(.6,.2,.2) → (.75,0,.25)</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">生成器目标，不是新的模型能力</text>
<rect x="40" y="248" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">分母与</text>
<text x="53" y="302" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">microbatch</text>
<rect x="220" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">16／5＝3.2；均值直接平均得到 4</text>
<rect x="610.0" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">验证统计量，不模拟 DDP／梯度</text>
<rect x="40" y="326" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">token 抽样</text>
<rect x="220" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">各半 tokens，长度2／8 → 样本 .8／.2</text>
<rect x="610.0" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">基于均值，实际长度变化仍会漂移</text>
<rect x="40" y="394" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="423" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">dense 计算</text>
<rect x="220" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">总 1,020,000；额外 420,000 FLOPs</text>
<rect x="610.0" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">假想 N=1,000；不是硬件速度</text>
<line x1="40" y1="504" x2="1000" y2="504" stroke="#e0e7e2"/>
<text x="40" y="528" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">有限 N、pass@k 与调度积分也有边界测试；没有运行上游 benchmark 或 trainer。</text>
</g>
</svg>
