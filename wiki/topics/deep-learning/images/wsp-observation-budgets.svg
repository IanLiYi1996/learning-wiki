<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">无梯度、无前向、无反馈：三个不同限制</title>
<desc id="desc">原文实验权限的学习分类；详细协议仍需查对应实验与日志。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">无梯度、无前向、无反馈：三个不同限制</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原文实验权限的学习分类；详细协议仍需查对应实验与日志。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">权重文本</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">实验 1–2：不允许运行，但提供相应架构与输入语义</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">静态分析</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">实验 3：可用 Python 分析参数，不允许输入前向</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">运行观测</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">实验 7：纯权重未成功，放宽到注意力观测后成功</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">验证反馈</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">实验 6／8：工具写参数，前向服务也可提供中间激活</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">层次表示可见证据的差异，不是总计算量排名；前向调用数不等于题目数量。</text>
</g>
</svg>
