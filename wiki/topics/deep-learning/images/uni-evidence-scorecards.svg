<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="558" viewBox="0 0 1040 558" role="img" aria-labelledby="title desc">
<title id="title">四张成绩单，不用一项提高替代所有改善</title>
<desc id="desc">原创证据地图；受控与 real-world 实验的样本、预算和协议分开。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="558" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">四张成绩单，不用一项提高替代所有改善</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创证据地图；受控与 real-world 实验的样本、预算和协议分开。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">成绩单</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">回答什么</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">不能推出什么</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Accuracy</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">指定抽样的一次成功率</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">所有题更好、贪心成绩相同</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Coverage</text>
<rect x="220" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">给定采样预算至少成功一次</text>
<rect x="610.0" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">用户能识别并收到正确答案</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Retention</text>
<rect x="220" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">持出语料损失与多个能力指标</text>
<rect x="610.0" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">旧知识全部恢复、代码一定提高</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">后续学习</text>
<rect x="220" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">同续训配置下更好的适应结果</text>
<rect x="610.0" y="384" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">所有任务序列永不遗忘</text>
<line x1="40" y1="494" x2="1000" y2="494" stroke="#e0e7e2"/>
<text x="40" y="518" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">best-observed frontier 是事后选择；原文也有 staged／其他目标较优及描述冲突。</text>
</g>
</svg>
