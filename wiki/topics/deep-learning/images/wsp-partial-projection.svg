<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="562" viewBox="0 0 1040 562" role="img" aria-labelledby="title desc">
<title id="title">投影选中列，不会自动清除其他列</title>
<desc id="desc">原创数字例：u=(1,0)，W 的每列表示输入对输出的贡献。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="562" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">投影选中列，不会自动清除其他列</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创数字例：u=(1,0)，W 的每列表示输入对输出的贡献。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">核对项</text>
<rect x="220" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">原矩阵</text>
<rect x="480.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">只处理第一列</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">处理全部两列</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">第一行</text>
<rect x="220" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[2,3]</text>
<rect x="480.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[0,3]</text>
<rect x="740.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[0,0]</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">第二行</text>
<rect x="220" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[4,5]</text>
<rect x="480.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[4,5]</text>
<rect x="740.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">[4,5]</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">第一列沿 u</text>
<rect x="220" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">2</text>
<rect x="480.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="740.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">第二列沿 u</text>
<rect x="220" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">3</text>
<rect x="480.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">3</text>
<rect x="740.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">0</text>
<rect x="40" y="452" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="481" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">能推出什么</text>
<rect x="220" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">存在该方向贡献</text>
<rect x="480.0" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">选中列已处理；整体仍有贡献</text>
<rect x="740.0" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">这个矩阵各列均垂直于 u</text>
<line x1="40" y1="498" x2="1000" y2="498" stroke="#e0e7e2"/>
<text x="40" y="522" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">本例是几何，不是定位语言模型行为方向或复现 Qwen 补丁的代码。</text>
</g>
</svg>
