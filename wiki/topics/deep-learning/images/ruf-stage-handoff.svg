<text x="520.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Reasoning RL</text>
<text x="520.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">结果验证与可学习性</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Coding RL</text>
<text x="856.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">竞赛代码与固定测试</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">IF RL</text>
<text x="856.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">必须逐条满足的约束</text>
<rect x="392" y="308" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">General Agent</text>
<text x="520.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">工具编排与终局状态</text>
<rect x="56" y="308" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Coding Agent</text>
<text x="184.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">持久工作区与执行测试</text>
<rect x="56" y="488" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="541.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">Search Agent</text>
<text x="184.0" y="576.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">搜索证据、预算与长轨迹</text>
