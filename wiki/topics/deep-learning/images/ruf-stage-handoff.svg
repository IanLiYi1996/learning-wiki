<line x1="40" y1="656" x2="1000" y2="656" stroke="#e0e7e2"/>
<text x="40" y="680" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">蓝箭头表示 checkpoint 接力；目标变了，旧能力、数据合同和 optimizer 状态都须重新检查。</text>
