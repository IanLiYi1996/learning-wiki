<text x="520.0" y="541.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">RLHF</text>
<text x="520.0" y="576.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">新回答接受开放质量评分</text>
