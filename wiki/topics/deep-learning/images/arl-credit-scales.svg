<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="436" viewBox="0 0 1040 436" role="img" aria-labelledby="title desc">
<title id="title">信用分配：结果方向、轮级强弱与未来估值</title>
<desc id="desc">比较本仓库 ALFWorld 实现；不是三种方法的质量排名。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="436" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">信用分配：结果方向、轮级强弱与未来估值</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">比较本仓库 ALFWorld 实现；不是三种方法的质量排名。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">方法</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">信号怎样形成</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">失效边界</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">ALFWorld 基线</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">终局奖励；同轨迹动作共享优势</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">成功绕路也可能同奖；同组同分退化</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">AgentOPSD</text>
<rect x="220" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">Skill teacher 调整轮级强弱</text>
<rect x="610.0" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">默认最终倍率 0.9–1.1；不能翻转终局方向</text>
<rect x="40" y="316" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">TEMPO</text>
<rect x="220" y="316" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">段回报＋终点估值；macro-step 分支比较</text>
<rect x="610.0" y="316" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">critic 偏差经 bootstrap 传播；恢复合同</text>
<text x="623.0" y="370" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">另核验</text>
<line x1="40" y1="372" x2="1000" y2="372" stroke="#e0e7e2"/>
<text x="40" y="396" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">turn 的概率证据不是因果贡献；macro-step 新采样也不证明旧前缀严格 on-policy。</text>
