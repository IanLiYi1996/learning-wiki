<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="588" viewBox="0 0 1040 588" role="img" aria-labelledby="title desc">
<title id="title">训练的两种渐进：先扩模态，再切目标</title>
<desc id="desc">根据论文配方重画；训练 token 量与输出向量维度不是同一量。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="588" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">训练的两种渐进：先扩模态，再切目标</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">根据论文配方重画；训练 token 量与输出向量维度不是同一量。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">阶段</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">模态与目标</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">注意</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">文本 pre-</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">finetuning</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">300B tokens；蒸馏＋小权重对比</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">先铺共享表示，不是 caption 生成</text>
<rect x="40" y="258" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">多模态 pre-</text>
<text x="53" y="312" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">finetuning</text>
<rect x="220" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">2T tokens；加入图／音／视频，蒸馏</text>
<rect x="610.0" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">vision 可训练；audio encoder 冻结</text>
<rect x="40" y="336" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="365" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">多模态</text>
<text x="53" y="390" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">finetuning</text>
<rect x="220" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">600B tokens；contrastive＋GOR＋MRL</text>
<rect x="610.0" y="336" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">适配排名、分散程度与前缀维度</text>
<rect x="40" y="414" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="443" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">合并／量化分支</text>
<rect x="220" y="414" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">同一训练轨迹权重平均；单独 QAT</text>
<rect x="610.0" y="414" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="443" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不是任意模型平均或全部模块一律 4-bit</text>
<line x1="40" y1="524" x2="1000" y2="524" stroke="#e0e7e2"/>
<text x="40" y="548" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">匹配样本、token、更新和计算是不同控制；消融检查点与最终模型也不同。</text>
</g>
</svg>
