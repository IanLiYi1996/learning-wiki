<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">(0,1) ／ (0,0)</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">(0,1) ／ (0,1)</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">求和再按组标准化</text>
<rect x="220" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">优势 ±0.7071</text>
<rect x="610.0" y="248" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">优势 ±0.7071</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">分通道标准化再求和</text>
<rect x="220" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">b = ±0.7071</text>
<rect x="610.0" y="316" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">b = ±1.4142</text>
<rect x="40" y="384" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">共同 batch 标准</text>
<text x="53" y="438" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">化</text>
<rect x="220" y="384" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">GDPO 优势 ±0.5477</text>
<rect x="610.0" y="384" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">GDPO 优势 ±1.0954</text>
<line x1="40" y1="440" x2="1000" y2="440" stroke="#e0e7e2"/>
<text x="40" y="464" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">最后一行共用 batch sample std √(5/3)；不是再按每组归一化，也不是恢复全部奖励向量。</text>
