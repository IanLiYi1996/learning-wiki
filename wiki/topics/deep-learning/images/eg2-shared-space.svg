<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">不同输入，共享骨干，最后才得到可比较的向量</title>
<desc id="desc">箭头表示概念数据变换；不是独立单模态向量的简单平均。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="540" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">不同输入，共享骨干，最后才得到可比较的向量</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">箭头表示概念数据变换；不是独立单模态向量的简单平均。</text>
<rect x="56" y="128" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">文本／图／音／视频</text>
<text x="184.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">可组合的模态片段</text>
<rect x="392" y="128" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">token 与适配</text>
<text x="520.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">视觉／音频 soft tokens</text>
<text x="520.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">投影到共同宽度</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="169.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">共享双向骨干</text>
<text x="856.0" y="204.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">联合处理输入序列</text>
<text x="856.0" y="227.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">projection-only PLE</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">mean pooling</text>
<text x="856.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">沿序列轴汇总</text>
<rect x="392" y="308" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="349.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">投影与 L2</text>
<text x="520.0" y="384.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">768 维单位向量</text>
<text x="520.0" y="407.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">MRL 截断后再归一化</text>
<rect x="56" y="308" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="349.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">任务检索</text>
<text x="184.0" y="384.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">query／document 前缀</text>
<text x="184.0" y="407.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">比较、排序、验收</text>
<path d="M 312,188 L 392,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 648,188 L 728,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 856,248 L 856,308" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 728,368 L 648,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 392,368 L 312,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<line x1="40" y1="476" x2="1000" y2="476" stroke="#e0e7e2"/>
<text x="40" y="500" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">模块化 encoder 与共享语义空间是两回事；向量相近不等于对象同一或用户获权。</text>
</g>
</svg>
