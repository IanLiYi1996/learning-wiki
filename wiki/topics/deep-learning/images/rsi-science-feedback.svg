<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
<title id="title">科学研究反馈：新数据改变假说，未必改变改进器</title>
<desc id="desc">原创职责示意；不能理解成所有系统都自动执行每一步。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="590" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">科学研究反馈：新数据改变假说，未必改变改进器</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创职责示意；不能理解成所有系统都自动执行每一步。</text>
<rect x="56" y="128" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">当前研究状态</text>
<text x="184.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">人指定问题与数据范围</text>
<rect x="392" y="128" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">文献和分析</text>
<text x="520.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">提出有证据的候选</text>
<rect x="728" y="128" width="256" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="181.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">人审查候选</text>
<text x="856.0" y="216.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">选择可执行实验</text>
<rect x="728" y="308" width="256" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="856.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">人和实验室</text>
<text x="856.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">协议、培养与测量</text>
<rect x="392" y="308" width="256" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">数据分析</text>
<text x="520.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">查代码与解释是否有效</text>
<rect x="56" y="308" width="256" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="184.0" y="361.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">更新假说</text>
<text x="184.0" y="396.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">保留证据、安排下一轮</text>
<path d="M 312,188 L 392,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 648,188 L 728,188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 856,248 L 856,308" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 728,368 L 648,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 392,368 L 312,368" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 184,428 L 184,455 L 24,455 L 24,188 L 56,188" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#feedback)" stroke-linejoin="round"/>
<rect x="51.0" y="442.0" width="106" height="25" fill="#fff"/>
<text x="104.0" y="460.0" font-size="15" fill="#7c3aed" font-weight="400" text-anchor="middle">研究状态反馈</text>
<line x1="40" y1="526" x2="1000" y2="526" stroke="#e0e7e2"/>
<text x="40" y="549" font-size="14" fill="#63736a" font-weight="400" text-anchor="start">蓝色：前向信息　紫色：反馈／再执行</text>
<text x="40" y="571" font-size="14" fill="#63736a" font-weight="400" text-anchor="start">人的验证责任仍在；体外候选不等于疗效，研究产物不等于元算法升级。</text>
</g>
</svg>
