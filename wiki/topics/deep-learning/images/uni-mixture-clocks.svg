<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="578" viewBox="0 0 1040 578" role="img" aria-labelledby="title desc">
<title id="title">比例、调度与计算分别记账</title>
<desc id="desc">原创换算与论文调度对照；配置平均不等于实际 token 平均。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="578" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">比例、调度与计算分别记账</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创换算与论文调度对照；配置平均不等于实际 token 平均。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">账本</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">教学观察</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">验收条件</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">样本 → token</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">平均长度 2／8，各半样本得 20%／80%</text>
<text x="233" y="234" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">tokens</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">测量长度；想等 token 则样本 80%／20%</text>
<rect x="40" y="258" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">比例 → 时间</text>
<rect x="220" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">constant／decay／growth／half 平均 0.5</text>
<text x="233" y="312" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">%</text>
<rect x="610.0" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">不同参数状态、不同出现时机</text>
<rect x="40" y="336" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="365" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">token → loss</text>
<rect x="220" y="336" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">权重、mask、pooled／separate 都影响贡献</text>
<rect x="610.0" y="336" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">保存原始计数与目标分母</text>
<rect x="40" y="404" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="433" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">处理 → 计算</text>
<rect x="220" y="404" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="433" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">训练 6N；生成＋训练 8N；prompt 仍处理</text>
<rect x="610.0" y="404" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="433" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">估算不是墙钟、验证器或费用</text>
<line x1="40" y1="514" x2="1000" y2="514" stroke="#e0e7e2"/>
<text x="40" y="538" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">等更新、等曝光、等 token、等 FLOPs 是不同实验；最优曲线还要说明选择过程。</text>
</g>
</svg>
