<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="562" viewBox="0 0 1040 562" role="img" aria-labelledby="title desc">
<title id="title">更小 NLL 可能来自改变监督对象</title>
<desc id="desc">四个假想前向 logprob；不是采样时环境观察的真实策略概率。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="562" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">更小 NLL 可能来自改变监督对象</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">四个假想前向 logprob；不是采样时环境观察的真实策略概率。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">位置</text>
<rect x="220" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">logprob</text>
<rect x="480.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="493.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">监督动作 toy</text>
<rect x="740.0" y="126" width="260.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="753.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">误监督全部</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">上下文</text>
<rect x="220" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">−0.1</text>
<rect x="480.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=0</text>
<rect x="740.0" y="180" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="40" y="248" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">模型动作</text>
<rect x="220" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">−2</text>
<rect x="480.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="740.0" y="248" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="40" y="316" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="345" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">工具观察</text>
<rect x="220" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">−0.2</text>
<rect x="480.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=0</text>
<rect x="740.0" y="316" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="345" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="40" y="384" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="413" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">模型动作</text>
<rect x="220" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">−3</text>
<rect x="480.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="493.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="740.0" y="384" width="260.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="753.0" y="413" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">mask=1</text>
<rect x="40" y="452" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="481" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">平均 NLL</text>
<rect x="220" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">由上述数字算出</text>
<rect x="480.0" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="493.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">2.5</text>
<rect x="740.0" y="452" width="260.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="753.0" y="481" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">1.325</text>
<line x1="40" y1="498" x2="1000" y2="498" stroke="#e0e7e2"/>
<text x="40" y="522" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">数值降低不证明模型改善；真实 mask 必须按模板和阶段检查，不能仅按消息角色硬套。</text>
</g>
</svg>
