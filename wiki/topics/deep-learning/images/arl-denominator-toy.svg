<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="446" viewBox="0 0 1040 446" role="img" aria-labelledby="title desc">
<title id="title">预测没变，报告的 loss 也能变</title>
<desc id="desc">原创数字；不是模型成绩、训练曲线或真实梯度实测。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="446" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">预测没变，报告的 loss 也能变</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">原创数字；不是模型成绩、训练曲线或真实梯度实测。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">同一批数据</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">归约 A</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">归约 B</text>
<rect x="40" y="180" width="180" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">loss：[2] 与 [0,</text>
<text x="53" y="234" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">0,0]</text>
<rect x="220" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">sample mean = 1</text>
<rect x="610.0" y="180" width="390.0" height="78" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">token mean = 0.5</text>
<rect x="40" y="258" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="287" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">8 条；3 条非零</text>
<text x="53" y="312" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">objective</text>
<rect x="220" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">原始分母：−1/8 = −0.125</text>
<rect x="610.0" y="258" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="287" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">活跃分母：−1/3 ≈ −0.3333</text>
<rect x="40" y="336" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="365" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">发生了什么</text>
<rect x="220" y="336" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">改变训练权重或指标定义</text>
<rect x="610.0" y="336" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="365" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">没有新采样，也没有权重改善</text>
<line x1="40" y1="382" x2="1000" y2="382" stroke="#e0e7e2"/>
<text x="40" y="406" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">比较 loss 前先固定 mask、sequence／token 分母与零目标处理；真实能力要看独立验收。</text>
</g>
</svg>
