<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">本地轻量，不等于远端无成本</title>
<desc id="desc">根据固定依赖与客户端职责拆分；不是服务部署或报价。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">本地轻量，不等于远端无成本</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">根据固定依赖与客户端职责拆分；不是服务部署或报价。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">本地编排</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">数据、prompt、环境、奖励与 Datum／custom loss</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">远程模型</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">PyTRIO 采样、模型前向／反向、LoRA 参数更新</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">其他服务</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">搜索、teacher、judge 的请求与 token 消耗另计</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">验证责任</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">脚本可读不等于服务内核已核验；SDK／服务版本也要固定</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">CPU 依赖只是本地路径；API 费用、模型权重状态、日志隐私与工具隔离仍然要检查。</text>
</g>
</svg>
