<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">一个 App，可以查两本不同的账</title>
<desc id="desc">相同地址字符不合并两个网络的资产；数字只作教学。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="640" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">一个 App，可以查两本不同的账</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">相同地址字符不合并两个网络的资产；数字只作教学。</text>
<path d="M 520,235 L 520,285" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<path d="M 520,285 L 220,285 L 220,330" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="345.8" y="272.0" width="48.4" height="25" fill="#fff"/>
<text x="370.0" y="290.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">查 A</text>
<path d="M 520,285 L 820,285 L 820,330" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="645.8" y="272.0" width="48.4" height="25" fill="#fff"/>
<text x="670.0" y="290.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">查 B</text>
<rect x="400" y="135" width="240" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="178.0" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">同一个钱包 App</text>
<text x="520.0" y="213.0" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">切换访问网络</text>
<rect x="60" y="330" width="320" height="150" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="220.0" y="386.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">网络 A</text>
<text x="220.0" y="421.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">地址：同一段字符</text>
<text x="220.0" y="444.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">本网络原生余额：100</text>
<rect x="660" y="330" width="320" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="820.0" y="386.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">网络 B</text>
<text x="820.0" y="421.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">地址：同一段字符</text>
<text x="820.0" y="444.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">本网络原生余额：0</text>
<line x1="40" y1="576" x2="1000" y2="576" stroke="#e0e7e2"/>
<text x="40" y="600" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">资产要连同网络和合约/Mint 辨认；同名、同图标都不充分。</text>
</g>
</svg>
