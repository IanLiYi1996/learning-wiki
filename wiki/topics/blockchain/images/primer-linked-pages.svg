<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">新账页引用旧账页的指纹</title>
<desc id="desc">时间顺序由左到右；蓝色箭头表示向前一页引用。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="560" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">新账页引用旧账页的指纹</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">时间顺序由左到右；蓝色箭头表示向前一页引用。</text>
<path d="M 400,240 L 320,240" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="337.0" y="227.0" width="46" height="25" fill="#fff"/>
<text x="360.0" y="245.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">引用</text>
<path d="M 740,240 L 660,240" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="677.0" y="227.0" width="46" height="25" fill="#fff"/>
<text x="700.0" y="245.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">引用</text>
<rect x="60" y="160" width="260" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="190.0" y="221.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">区块 A</text>
<text x="190.0" y="256.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">交易集合</text>
<text x="190.0" y="279.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">自己的摘要 H_A</text>
<rect x="400" y="160" width="260" height="160" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="530.0" y="221.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">区块 B</text>
<text x="530.0" y="256.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">交易集合</text>
<text x="530.0" y="279.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">引用 H_A</text>
<rect x="740" y="160" width="260" height="160" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="870.0" y="221.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">区块 C</text>
<text x="870.0" y="256.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">交易集合</text>
<text x="870.0" y="279.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">引用 H_B</text>
<text x="520" y="399" font-size="18" fill="#23312b" font-weight="400" text-anchor="middle">改 A 的内容 → A 的指纹变化 → 后续引用与共识条件需重新核对</text>
<line x1="40" y1="496" x2="1000" y2="496" stroke="#e0e7e2"/>
<text x="40" y="520" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">H_A/H_B 是示意名称，不是真实区块哈希；历史稳定还依赖共识。</text>
</g>
</svg>
