<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="504" viewBox="0 0 1040 504" role="img" aria-labelledby="title desc">
<title id="title">执行证明、数据可用性与共识分开看</title>
<desc id="desc">采用某品牌、桥或证明技术，不自动继承全部 L1 安全。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="504" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">执行证明、数据可用性与共识分开看</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">采用某品牌、桥或证明技术，不自动继承全部 L1 安全。</text>
<rect x="40" y="126" width="180" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="53" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">类型</text>
<rect x="220" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="233" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">核心边界</text>
<rect x="610.0" y="126" width="390.0" height="54" fill="#e5f1eb" stroke="#e0e7e2"/>
<text x="623.0" y="155" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">仍要检查</text>
<rect x="40" y="180" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="209" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">独立 L1／侧链</text>
<rect x="220" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">自己的共识与状态验证</text>
<rect x="610.0" y="180" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="209" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">与其他链的桥和资产控制</text>
<rect x="40" y="248" width="180" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="277" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Optimistic</text>
<text x="53" y="302" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">rollup</text>
<rect x="220" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">L1 承诺／数据 + 争议机制</text>
<rect x="610.0" y="248" width="390.0" height="78" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="277" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">挑战、退出、排序器与升级</text>
<rect x="40" y="326" width="180" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="53" y="355" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">ZK rollup</text>
<rect x="220" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="233" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">有效性证明 + L1 数据可用性</text>
<rect x="610.0" y="326" width="390.0" height="68" fill="#f7f9f8" stroke="#e0e7e2"/>
<text x="623.0" y="355" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">实现、治理与可用性</text>
<rect x="40" y="394" width="180" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="53" y="423" font-size="17" fill="#23312b" font-weight="600" text-anchor="start">Validium</text>
<rect x="220" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="233" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">有效性证明；另有数据可用性</text>
<rect x="610.0" y="394" width="390.0" height="68" fill="#fff" stroke="#e0e7e2"/>
<text x="623.0" y="423" font-size="17" fill="#23312b" font-weight="400" text-anchor="start">数据保存／获取与退出条件</text>
<line x1="40" y1="440" x2="1000" y2="440" stroke="#e0e7e2"/>
<text x="40" y="464" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">对照的是职责与条件，不是性能排名。</text>
</g>
</svg>
