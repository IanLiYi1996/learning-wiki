<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">债务没变，抵押价值跌了</title>
<desc id="desc">单一抵押物、80% 阈值的假设，不是当前资产参数。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="610" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">债务没变，抵押价值跌了</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">单一抵押物、80% 阈值的假设，不是当前资产参数。</text>
<path d="M 440,265 L 600,265" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="482.0" y="252.0" width="76" height="25" fill="#fff"/>
<text x="520.0" y="270.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">价格下跌</text>
<rect x="80" y="165" width="360" height="200" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".4" stroke-width="1.5"/>
<text x="260.0" y="246.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">初始</text>
<text x="260.0" y="281.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">抵押：1000 U；债务：600 U</text>
<text x="260.0" y="304.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">健康因子约 1.33</text>
<rect x="600" y="165" width="360" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="780.0" y="246.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">抵押跌价后</text>
<text x="780.0" y="281.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">抵押：700 U；债务：600 U</text>
<text x="780.0" y="304.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">健康因子约 0.93</text>
<text x="520" y="445" font-size="21" fill="#23312b" font-weight="400" text-anchor="middle">健康因子 = 抵押价值 × 阈值 / 债务价值</text>
<line x1="40" y1="546" x2="1000" y2="546" stroke="#e0e7e2"/>
<text x="40" y="570" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">低于 1 表示可清算风险区间；实际处置由具体协议和市场规则决定。</text>
</g>
</svg>
