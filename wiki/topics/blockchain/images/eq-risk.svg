<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="778" viewBox="0 0 1040 778" role="img" aria-labelledby="title desc">
<title id="title">研究股票，只覆盖合约风险的一部分</title>
<desc id="desc">五组不同故障来源；公开账本不替代权利、数据、流动性或法律证据。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="778" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">研究股票，只覆盖合约风险的一部分</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">五组不同故障来源；公开账本不替代权利、数据、流动性或法律证据。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">经济对象</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">公司经营、参考价格、股类、分红与拆股</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">持仓与执行</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">资金费、基差、点差、深度、保证金与 ADL</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">数据与运营</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">外部源、映射、Oracle、Mark、部署参数与暂停</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">资产与访问</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">USDC、钱包、签名、网络、桥、API 与恢复</text>
<rect x="56" y="589" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="625" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">权利与追偿</text>
<text x="292" y="621" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">产品主体、准入、托管、合同、保护范围与争议</text>
<line x1="40" y1="714" x2="1000" y2="714" stroke="#e0e7e2"/>
<text x="40" y="738" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">质押不等于股票储备或用户赔付；监管也不等于投资收益保险。</text>
</g>
</svg>
