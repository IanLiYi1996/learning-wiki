<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">小本金承担大头寸，价格没归零就可能强平</title>
<desc id="desc">假设 100 U 保证金、1000 U 线性多头；维持要求固定 50 U。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="610" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">小本金承担大头寸，价格没归零就可能强平</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">假设 100 U 保证金、1000 U 线性多头；维持要求固定 50 U。</text>
<path d="M 300,260 L 400,260" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="321.45" y="247.0" width="57.099999999999994" height="25" fill="#fff"/>
<text x="350.0" y="265.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">跌 4%</text>
<path d="M 640,260 L 740,260" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#main)" stroke-linejoin="round"/>
<rect x="667.0" y="247.0" width="46" height="25" fill="#fff"/>
<text x="690.0" y="265.0" font-size="15" fill="#2563eb" font-weight="400" text-anchor="middle">再跌</text>
<rect x="60" y="165" width="240" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".4" stroke-width="1.5"/>
<text x="180.0" y="241.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">价格 100 U</text>
<text x="180.0" y="276.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">名义 1000 U</text>
<text x="180.0" y="299.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">保证金权益 100 U</text>
<rect x="400" y="165" width="240" height="190" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".4" stroke-width="1.5"/>
<text x="520.0" y="241.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">价格 96 U</text>
<text x="520.0" y="276.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">头寸亏 40 U</text>
<text x="520.0" y="299.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">权益剩 60 U</text>
<rect x="740" y="165" width="240" height="190" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".4" stroke-width="1.5"/>
<text x="860.0" y="241.5" font-size="20" fill="#23312b" font-weight="600" text-anchor="middle">价格 95 U</text>
<text x="860.0" y="276.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">头寸亏 50 U</text>
<text x="860.0" y="299.5" font-size="16" fill="#52645a" font-weight="400" text-anchor="middle">达到假设维持要求</text>
<text x="520" y="443" font-size="20" fill="#23312b" font-weight="400" text-anchor="middle">标的跌 4%，初始保证金已损失 40%（本例忽略费用）</text>
<line x1="40" y1="546" x2="1000" y2="546" stroke="#e0e7e2"/>
<text x="40" y="570" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">实际清算价还看标记价格、费用和风险档；不能用此图算真实强平价。</text>
</g>
</svg>
