<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662" role="img" aria-labelledby="title desc">
<title id="title">执行、数据、结算，分别回答什么</title>
<desc id="desc">分层是职责，不是“用了证明就全部安全”的结论。</desc>
<defs>
<marker id="main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#2563eb"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 3.5 L0 7 Z" fill="#7c3aed"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1040" height="662" rx="12" fill="#ffffff"/>
<text x="40" y="47" font-size="25" fill="#23312b" font-weight="700" text-anchor="start">执行、数据、结算，分别回答什么</text>
<text x="40" y="78" font-size="16" fill="#63736a" font-weight="400" text-anchor="start">分层是职责，不是“用了证明就全部安全”的结论。</text>
<rect x="56" y="125" width="928" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".3"/>
<text x="76" y="161" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">执行</text>
<text x="292" y="157" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">这些请求按程序算出的新状态是什么？</text>
<rect x="56" y="241" width="928" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".3"/>
<text x="76" y="277" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">数据可用性</text>
<text x="292" y="273" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">核验、重建和退出所需数据还能取得吗？</text>
<rect x="56" y="357" width="928" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-opacity=".3"/>
<text x="76" y="393" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">结算</text>
<text x="292" y="389" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">哪一个状态承诺被相应基础规则最终接受？</text>
<rect x="56" y="473" width="928" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-opacity=".3"/>
<text x="76" y="509" font-size="20" fill="#23312b" font-weight="600" text-anchor="start">产品与退出</text>
<text x="292" y="505" font-size="17" fill="#52645a" font-weight="400" text-anchor="start">升级、排序器、应急权限和资产出口实际能用吗？</text>
<line x1="40" y1="598" x2="1000" y2="598" stroke="#e0e7e2"/>
<text x="40" y="622" font-size="15" fill="#63736a" font-weight="400" text-anchor="start">侧链、rollup、validium 采用不同组合；品牌不能代替具体安全模型。</text>
</g>
</svg>
